class="contract-info">
            <div class="name">Утренний ритуал</div>
            <div class="reward">+100 Страсти</div>
          </div>
          <button class="small-btn" onclick="completeTask(100, this)">Выполнить</button>
        </div>
        <div class="contract-item">
          <div class="contract-info">
            <div class="name">Ночная исповедь</div>
            <div class="reward">+250 Страсти</div>
          </div>
          <button class="small-btn" onclick="completeTask(250, this)">Выполнить</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-leaderboard" class="tab-content">
    <div class="card">
      <div style="font-weight: 600; margin-bottom: 12px;">Топ Игроков</div>
      <div class="contract-list">
        <div class="contract-item">
          <div>1. Alex_VIP</div>
          <div style="color: var(--accent-color); font-weight: bold;">15,400</div>
        </div>
        <div class="contract-item">
          <div>2. Вы</div>
          <div style="color: var(--accent-color); font-weight: bold;" id="my-rank-val">1,250</div>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-profile" class="tab-content">
    <div class="card" style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 10px;">🔥</div>
      <div style="font-size: 18px; font-weight: 700;">Уровень 1: Адепт</div>
      <div style="margin-top: 15px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 10px;">
        Контент предназначен строго для лиц старше 18 лет.
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('pacts', this)">
      <div class="nav-icon">📜</div>
      <div>Пакты</div>
    </div>
    <div class="nav-item" onclick="switchTab('leaderboard', this)">
      <div class="nav-icon">🏆</div>
      <div>Рейтинг</div>
    </div>
    <div class="nav-item" onclick="switchTab('profile', this)">
      <div class="nav-icon">👤</div>
      <div>Профиль</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('user-greeting').innerText = `Игрок: ${tg.initDataUnsafe.user.first_name}`;
      }
    }

    // Виброотклик при «ударе» печатки на 120 мс
    setTimeout(() => {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('heavy');
      }
    }, 120);

    // Вся заставка скрывается через 9 секунд
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.classList.add('hidden');
    }, 9000);

    let points = 1250;

    function completeTask(reward, btn) {
      points += reward;
      document.getElementById('points-val').innerText = points.toLocaleString();
      btn.innerText = "Готово ✓";
      btn.disabled = true;
      btn.style.opacity = "0.5";
      btn.style.borderColor = "#4ccc54";
      btn.style.color = "#4ccc54";
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }
  </script>
</body>
</html>
