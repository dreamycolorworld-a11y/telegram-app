<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pact & Passion</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a24;
      --accent-color: #ff2a5f;
      --accent-hover: #e02250;
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: #2a2a3a;
    }

    body {
      margin: 0;
      padding: 16px 16px 80px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ЭКРАН ЗАСТАВКИ (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #08080a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-gif {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(255, 42, 95, 0.4);
    }

    .splash-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent-color);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 15px rgba(255, 42, 95, 0.6);
    }

    /* НЕОНОВЫЙ ЗНАК 18+ */
    .age-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border: 2px solid var(--accent-color);
      border-radius: 20px;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      background: rgba(255, 42, 95, 0.15);
      box-shadow: 0 0 12px rgba(255, 42, 95, 0.5), inset 0 0 8px rgba(255, 42, 95, 0.3);
      text-shadow: 0 0 8px #ff2a5f;
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 8px rgba(255, 42, 95, 0.4);
      }
      100% {
        box-shadow: 0 0 18px rgba(255, 42, 95, 0.8), inset 0 0 10px rgba(255, 42, 95, 0.5);
      }
    }

    .splash-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      letter-spacing: 1px;
    }

    /* ОСНОВНОЙ ИНТЕРФЕЙС ИГРЫ */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
