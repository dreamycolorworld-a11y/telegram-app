    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

      margin: 0;
      padding: 16px 16px 80px 16px;

      color: var(--text-main);
      overflow-x: hidden;

      flex-direction: column;

      transition: opacity 0.8s ease, visibility 0.8s;
      background: #000000;
      overflow: hidden;
